          curl -fsSL -A "Mozilla/5.0" -e "https://dasmachtdas.de/" -o "partner-raw/v-a-o.png" "https://sv-timmerman.de/project_files/3cfb8386-ed9a-472e-9aa6-0a809ab803c3/14f484bb-1af5-4ba2-b55c-fdb1c24d371a_3.png?v=22cb6ffe50573a5e27952cbea132a267" || echo "FAIL v-a-o"
