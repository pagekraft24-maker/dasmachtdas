          curl -fsSL -A "Mozilla/5.0" -e "https://dasmachtdas.de/" -o "partner-raw/dte-dellentechnik.png" "https://sv-timmerman.de/project_files/3cfb8386-ed9a-472e-9aa6-0a809ab803c3/43fd19fc-582e-4b50-88bf-ad0f6333acb6_dte-logo-ws-300x175.png?v=d20e72c4a67ce2c6671b813d65084e95" || echo "FAIL dte-dellentechnik"
          curl -fsSL -A "Mozilla/5.0" -e "https://dasmachtdas.de/" -o "partner-raw/page-kraft.png" "https://sv-timmerman.de/project_files/3cfb8386-ed9a-472e-9aa6-0a809ab803c3/d02a04de-9ed7-4422-8b88-b488958bd87d_Bildschirmfoto-2026-05-01-um-17.32.53.png?v=9253f4de8af21808f6e6df77f708ab5e" || echo "FAIL page-kraft"
