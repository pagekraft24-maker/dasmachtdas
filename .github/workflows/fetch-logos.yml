name: fetch partner logos
on:
  push:
    branches: [tools/logos]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p partner-raw
          curl -fsSL -A "Mozilla/5.0" -e "https://dasmachtdas.de/" -o "partner-raw/svk-partner.png" "https://sv-timmerman.de/project_files/3cfb8386-ed9a-472e-9aa6-0a809ab803c3/06f701fe-c0a8-47d2-b381-4f87fa5adef7_svk-partner.png?v=5054a9948c0b057152c408c098d8de68" || echo "FAIL svk-partner"
