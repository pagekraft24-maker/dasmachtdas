name: fetch partner logos
on:
  push:
    branches: [tools/logos]
    paths: [".github/**"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fetch.py
      - run: |
          git config user.name "Pagekraft Bot"
          git config user.email "bot@page-kraft.de"
          git add -f partner-raw
          git commit -m "Partner-Logos geladen" || echo nothing
          git push
